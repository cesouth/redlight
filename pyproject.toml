[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roadtraffic"
version = "0.1.0"
description = "Lightweight, bring-your-own-data trafficability analysis for road networks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cory" }]
keywords = ["trafficability", "road network", "GPS", "OSM", "map matching", "routing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]

# Core dependencies: all pure-Python or lightweight wheels. No GDAL.
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "shapely>=2.0",
    "pyproj>=3.2",
    "networkx>=2.6",
]

[project.optional-dependencies]
# Shapefile / GeoPackage reading. Pulls fiona (GDAL binding). GeoJSON works
# without this.
shapefile = ["fiona>=1.8"]
# Development / testing.
dev = ["pytest>=7.0"]
# Documentation site build.
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0"]

[project.urls]
Documentation = "https://example.gitlab.io/roadtraffic"
Source = "https://gitlab.com/your-namespace/roadtraffic"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
