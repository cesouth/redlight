[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roadtraffic"
dynamic = ["version"]
description = "Lightweight, bring-your-own-data trafficability analysis for road networks."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cory Southall" }]
keywords = ["trafficability", "road network", "GPS", "OSM", "map matching", "routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]

# Core dependencies: all pure-Python or lightweight wheels. No GDAL.
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "shapely>=2.0",
    "pyproj>=3.2",
    "networkx>=2.6",
]

[project.optional-dependencies]
# Shapefile / GeoPackage reading. Pulls pyogrio (GDAL binding). GeoJSON and
# Overpass work without this. pyogrio>=0.12 requires Python 3.10+; this extra
# is unavailable on Python 3.9 even though the core package supports it.
shapefile = ["pyogrio>=0.10"]
# Static trafficability map rendering (roadtraffic.mapping.plot_speed_map).
# roadtraffic.mapping.to_geojson needs no extra dependency.
mapping = ["matplotlib>=3.5"]
# Development / testing.
dev = ["pytest>=7.0", "ruff>=0.4"]
# Documentation site build.
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0"]

[project.urls]
Source = "https://github.com/cesouth/roadtraffic"
Issues = "https://github.com/cesouth/roadtraffic/issues"
Changelog = "https://github.com/cesouth/roadtraffic/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# Single source of truth for the version: roadtraffic.__version__
[tool.setuptools.dynamic]
version = { attr = "roadtraffic.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 95
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E741",  # ambiguous variable names: the math uses V, L, s per the papers
]
